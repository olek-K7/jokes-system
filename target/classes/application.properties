spring.application.name=jokes-system
spring.main.banner-mode=off

logging.level.sql=debug
logging.level.root=info

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.generate-unique-name=false
spring.datasource.name=testdb

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.profiles.active=demo

# Prevent Hibernate from trying to alter or check the schema
spring.jpa.hibernate.ddl-auto=none

# Tell Spring Boot to always initialize the database using schema.sql and data.sql
spring.sql.init.mode=always

# Run SQL scripts AFTER Hibernate initializes.
spring.jpa.defer-datasource-initialization=true

management.endpoints.web.exposure.include=health,info,metrics